name: Quality

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      COMFYUI_PATH: ${{ github.workspace }}/ComfyUI
      PYTHONPATH: ${{ github.workspace }}/ComfyUI
    steps:
      - uses: actions/checkout@v4
      - name: Checkout ComfyUI V3 API source
        uses: actions/checkout@v4
        with:
          repository: Comfy-Org/ComfyUI
          path: ComfyUI
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime and development dependencies
        run: |
          python -m pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r ComfyUI/requirements.txt -r requirements.txt -r requirements-dev.txt
      - name: Compile Python
        run: python -m compileall -q sinyuk_nodes tests
      - name: Ruff lint
        run: ruff check --extend-exclude ComfyUI .
      - name: Ruff format
        run: ruff format --check --extend-exclude ComfyUI .
      - name: Pyright
        run: pyright
      - name: Tests
        run: |
          python - <<'PY'
          from comfy.cli_args import args
          args.cpu = True
          import pytest
          raise SystemExit(pytest.main())
          PY
